{{- if and .Values.github.token (not .Values.github.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strata.githubSecretName" . }}
  labels:
    {{- include "strata.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Only rendered when the operator supplied `github.token` directly and did not point at
  # a Secret they manage themselves. For production, prefer `github.existingSecret` with
  # External Secrets, Vault or the Secrets Store CSI driver, so the value never passes
  # through Helm values, `--set`, or your shell history.
  {{ .Values.github.existingSecretKey }}: {{ .Values.github.token | quote }}
{{- end }}
