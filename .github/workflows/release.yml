name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64

    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the labels
        id: meta
        uses: docker/metadata-action@b2391d37b4157fa4aa2e118d643f417910ff3242 # v3
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            STRATA_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Hand the digest to the merge job
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Collect the digests
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@b2391d37b4157fa4aa2e118d643f417910ff3242 # v3
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)

      - name: Check both architectures are in the manifest
        run: |
          set -euo pipefail
          TAG="$(jq -r '.tags[0]' <<< '${{ steps.meta.outputs.json }}')"
          docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' > /tmp/manifest.json

          for arch in amd64 arm64; do
            if ! jq -e --arg a "$arch" \
                 'any(.manifests[]?; .platform.architecture == $a and .platform.os == "linux")' \
                 /tmp/manifest.json >/dev/null; then
              echo "::error::$TAG is missing linux/$arch"
              jq -c '.manifests[]?.platform' /tmp/manifest.json
              exit 1
            fi
          done
          echo "$TAG carries both linux/amd64 and linux/arm64"

  chart:
    name: Publish the Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: merge

    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3

      - name: Sign in to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} \
                --username ${{ github.actor }} --password-stdin

      - name: Work out the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE_TAG="$VERSION"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="0.0.0-dev"
            IMAGE_TAG="edge"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Package and push
        run: |
          helm package deploy/helm/strata \
            --version "$VERSION" \
            --app-version "$VERSION"

          helm push "strata-${VERSION}.tgz" \
            "oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/charts"

      - name: Say how to install it
        run: |
          {
            echo "### Strata ${VERSION} published"
            echo '```bash'
            echo "docker pull ${REGISTRY}/${IMAGE}:${IMAGE_TAG}"
            echo "helm install strata oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/charts/strata --version ${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
